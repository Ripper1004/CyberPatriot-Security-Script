# =============================================================================
#  Example config for harden.sh  - copy it, fill it in from the README, then run:
#     cp config.example.conf my.conf
#     nano my.conf
#     sudo bash harden.sh --audit --config my.conf      (see what it would do)
#     sudo bash harden.sh --apply --config my.conf      (do it)
#
#  Separate names with spaces. Put values in "double quotes".
#  Lines starting with # are ignored.
# =============================================================================

# Administrators listed in the README (they keep / get sudo rights)
AUTHORIZED_ADMINS="alice bob"

# Other authorized users listed in the README (normal users, no sudo)
AUTHORIZED_USERS="carol dave erin"

# Services the README says must keep working. Keywords the script understands:
#   ssh apache nginx php mysql mariadb postgresql ftp vsftpd proftpd pure-ftpd
#   samba dns bind mail postfix dovecot cups nfs snmp vnc squid dhcp ldap
# Leave empty ("") if the README lists none.
CRITICAL_SERVICES="ssh"

# Strong password given to every authorized user EXCEPT the one running the
# script. 12+ characters with upper, lower, number and symbol.
# Use "skip" to leave passwords alone. Leave empty to be asked.
NEW_PASSWORD=""

# Account lockout after 5 wrong passwords: yes / no / ask
ENABLE_LOCKOUT="ask"

# Install every available update (can take 5-30 minutes): yes / no / ask
FULL_UPGRADE="ask"

# SSH password logins: yes / no / keep (keep = don't touch). Use "keep" unless
# the README says otherwise - nobody has SSH keys on a practice image.
SSH_PASSWORD_AUTH="keep"

# Extra firewall ports to open (only if the README needs them), e.g. "8080/tcp"
EXTRA_PORTS=""
